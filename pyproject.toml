[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deesseia"
version = "1.5.0"
description = "Deesseia - Goddess of Data Science"
readme = "README.md"
authors = [{ name = "Jean Decian", email = "jeandecian@hotmail.fr" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.5.0",
    "numpy>=1.24.0",
    "openpyxl>=3.0.0",
    "pandas>=1.5.0",
    "pyarrow>=10.0.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
    "seaborn>=0.12.0",
    "sqlalchemy>=2.0.0",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "data-science",
    "machine-learning",
    "deep-learning",
    "nlp",
    "statistics",
    "visualization",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
    "pandas-stubs>=2.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "scikit-learn-stubs>=0.0.0",
    "scipy-stubs>=0.0.0; python_version >= '3.12'",
]

[project.urls]
Homepage = "https://github.com/jeandecian/deesseia"
Repository = "https://github.com/jeandecian/deesseia"
Documentation = "https://deesseia.readthedocs.io"
Issues = "https://github.com/jeandecian/deesseia/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["deesseia*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
disable_error_code = ["import-untyped", "syntax"]

[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"
filterwarnings = ["ignore::PendingDeprecationWarning:seaborn.matrix"]
