[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deesseia"
version = "0.0.0"
description = "Deesseia - Goddess of Data Science"
readme = "README.md"
authors = [{ name = "Jean Decian", email = "jeandecian@hotmail.fr" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "pyarrow>=10.0.0",
    "sqlalchemy>=2.0.0",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "data-science",
    "machine-learning",
    "deep-learning",
    "nlp",
    "statistics",
    "visualization",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
    "pandas-stubs>=2.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/jeandecian/deesseia"
Repository = "https://github.com/jeandecian/deesseia"
Documentation = "https://deesseia.readthedocs.io"
Issues = "https://github.com/jeandecian/deesseia/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["deesseia*"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
