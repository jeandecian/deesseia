[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deesseia"
version = "0.0.0"
description = "Deesseia - Goddess of Data Science"
readme = "README.md"
authors = [{ name = "Jean Decian", email = "jeandecian@hotmail.fr" }]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "data-science",
    "machine-learning",
    "deep-learning",
    "nlp",
    "statistics",
    "visualization",
]

[project.urls]
Homepage = "https://github.com/jeandecian/deesseia"
Repository = "https://github.com/jeandecian/deesseia"
Documentation = "https://deesseia.readthedocs.io"
Issues = "https://github.com/jeandecian/deesseia/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["deesseia*"]
